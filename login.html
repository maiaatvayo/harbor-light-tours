<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in</title><link rel="stylesheet" href="style.css"><script>function go(e,to){e.preventDefault();location.href=to;return false}</script></head><body>
<header><h1>Sign in</h1><p>Harbor Light Tours account</p></header>
<div class="card"><label>Search tours<input type="text" name="q" placeholder="kayak, boat, sunset"></label></div>
<form class="card" onsubmit="return go(event,'index.html')"><label>Email<input type="email" name="email" autocomplete="username"></label><label>Password<input type="password" name="password" autocomplete="current-password"></label><button type="submit">Sign in</button></form><footer>Harbor Light Tours is a QA test site. Nothing is sold, stored or sent anywhere from these pages.</footer></body></html>
