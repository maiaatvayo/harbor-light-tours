<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your details: Private boat charter</title><link rel="stylesheet" href="style.css"><script>function go(e,to){e.preventDefault();location.href=to;return false}</script></head><body>
<header><h1>Private boat charter</h1><p>€320 per boat · up to 6 guests</p></header>
<form class="card" onsubmit="return go(event,'payment.html')">
<label>Date<select required><option>Saturday</option><option>Sunday</option></select></label>
<label>Guests<select required><option>2</option><option>4</option><option>6</option></select></label>
<label>Full name<input type="text" name="name" required autocomplete="name"></label>
<label>Email<input type="email" name="email" required autocomplete="email"></label>
<div class="check"><input type="checkbox" id="terms" required><label for="terms">I agree to the Terms and Conditions</label></div>
<div class="check"><input type="checkbox" id="hold" required><label for="hold">I authorize Harbor Light Tours to place a hold of €90 on my card as a security deposit, and to charge it in full if the boat is damaged or returned late.</label></div>
<div class="check"><input type="checkbox" id="nonref" required><label for="nonref">I understand this booking is non-refundable and cannot be changed.</label></div>
<button type="submit">Continue to payment</button></form><footer>Harbor Light Tours is a QA test site. Nothing is sold, stored or sent anywhere from these pages.</footer></body></html>
