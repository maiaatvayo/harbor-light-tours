<!doctype html><html lang="en"><head><meta charset="utf-8"><style>body{font-family:sans-serif;margin:10px}input{width:100%;padding:8px;margin:4px 0 8px;box-sizing:border-box}.row{display:flex;gap:8px}</style></head><body>
<form onsubmit="return false"><label>Card number<input inputmode="numeric" autocomplete="cc-number" name="cardnumber"></label>
<div class="row"><label>Expiry<input autocomplete="cc-exp" name="exp-date" placeholder="MM / YY"></label><label>CVC<input autocomplete="cc-csc" name="cvc"></label></div>
<label>Name on card<input autocomplete="cc-name" name="ccname"></label></form></body></html>
